<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    :root {
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.88);
      --ink: #3a3a42;
      --line: rgba(255, 255, 255, 0.5);
      --field: rgba(255, 255, 255, 0.16);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
    }

    body {
      min-height: 100vh;
      background: #4c1d95;
    }

    .scene {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse 55% 42% at 50% 46%, rgba(255, 255, 255, 0.16), transparent 70%),
        linear-gradient(180deg, #5b2aa8 0%, #7c3aed 24%, #b44adf 58%, #e879f9 100%);
    }

    .stars {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .mountains,
    .trees {
      position: absolute;
      left: 0;
      width: 100%;
      pointer-events: none;
    }

    .mountains {
      bottom: 0;
      height: 46vh;
    }

    .trees {
      bottom: 0;
      height: 34vh;
    }

    .card {
      position: relative;
      z-index: 2;
      width: min(340px, calc(100vw - 32px));
      margin-top: -4vh;
      padding: 34px 28px 26px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      background: rgba(255, 255, 255, 0.07);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.05) inset,
        0 18px 50px rgba(76, 29, 149, 0.28);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0 0 22px;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .field {
      position: relative;
      display: block;
      height: 42px;
      margin-bottom: 14px;
    }

    .field input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 42px;
      padding: 0 42px 0 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--field);
      color: white;
      font: inherit;
      font-size: 14px;
      outline: none;
    }

    .field input::placeholder { color: rgba(255, 255, 255, 0.82); }

    .field input:focus {
      border-color: white;
      background: rgba(255, 255, 255, 0.22);
    }

    .field svg {
      position: absolute;
      right: 14px;
      top: 12px;
      width: 18px;
      height: 18px;
      fill: none;
      stroke: white;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 2px 2px 16px;
      font-size: 12.5px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      user-select: none;
    }

    .remember input {
      appearance: none;
      width: 13px;
      height: 13px;
      margin: 0;
      border: 1.5px solid white;
      border-radius: 2px;
      background: transparent;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .remember input:checked {
      background: white;
    }

    .remember input:checked::after {
      content: "";
      width: 7px;
      height: 4px;
      border-left: 1.6px solid #4c1d95;
      border-bottom: 1.6px solid #4c1d95;
      transform: translateY(-1px) rotate(-45deg);
    }

    a {
      color: white;
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    button {
      width: 100%;
      height: 42px;
      border: 0;
      border-radius: 999px;
      background: white;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover { background: #f8f7fb; }
    button:active { transform: translateY(1px); }

    .signup {
      margin: 16px 0 0;
      text-align: center;
      font-size: 13px;
    }

    .signup a { font-weight: 700; }

    .message {
      margin: 0 0 12px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(40, 8, 70, 0.28);
      font-size: 12.5px;
      line-height: 1.4;
      text-align: center;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="scene">
    <svg class="stars" id="stars" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>

    <svg class="mountains" viewBox="0 0 1440 520" preserveAspectRatio="none" aria-hidden="true">
      <path fill="#c084fc" opacity="0.55" d="M0 300 C160 300 220 150 400 180 C560 206 620 90 800 140 C980 190 1040 80 1220 150 C1320 190 1380 120 1440 160 L1440 520 L0 520 Z"/>
      <path fill="#a855f7" opacity="0.85" d="M0 360 C180 360 260 210 460 250 C640 286 720 170 920 220 C1100 266 1180 180 1360 240 C1400 252 1420 230 1440 240 L1440 520 L0 520 Z"/>
      <path fill="#7e22ce" d="M0 430 C220 430 300 300 500 340 C700 380 780 280 980 330 C1160 376 1240 300 1440 360 L1440 520 L0 520 Z"/>
    </svg>

    <svg class="trees" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <symbol id="pine" viewBox="0 0 100 180">
        <path d="M50 2 L70 58 L58 54 L80 108 L64 102 L94 158 L56 158 L56 178 L44 178 L44 158 L6 158 L36 102 L20 108 L42 54 L30 58 Z"/>
      </symbol>
      <g fill="#4c1d95">
        <use href="#pine" x="-30" y="70" width="170" height="306"/>
        <use href="#pine" x="90" y="150" width="130" height="234"/>
        <use href="#pine" x="250" y="210" width="100" height="180"/>
        <use href="#pine" x="1040" y="190" width="110" height="198"/>
        <use href="#pine" x="1180" y="120" width="150" height="270"/>
        <use href="#pine" x="1320" y="90" width="170" height="306"/>
      </g>
      <g fill="#2e1065">
        <use href="#pine" x="-10" y="40" width="160" height="288"/>
        <use href="#pine" x="120" y="130" width="120" height="216"/>
        <use href="#pine" x="230" y="190" width="90" height="162"/>
        <use href="#pine" x="340" y="230" width="80" height="144"/>
        <use href="#pine" x="1020" y="220" width="85" height="153"/>
        <use href="#pine" x="1120" y="160" width="120" height="216"/>
        <use href="#pine" x="1240" y="80" width="155" height="279"/>
        <use href="#pine" x="1360" y="50" width="140" height="252"/>
      </g>
    </svg>

    <section class="card" aria-live="polite">
      <form id="login-view">
        <h1>Login</h1>
        <p class="message" id="login-message" hidden></p>

        <label class="field">
          <input id="username" name="username" type="text" placeholder="Username" autocomplete="username" required>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="3.2"/>
            <path d="M5.5 19.2c1.2-3 3.5-4.5 6.5-4.5s5.3 1.5 6.5 4.5"/>
          </svg>
        </label>

        <label class="field">
          <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="6" y="11" width="12" height="9" rx="1.6"/>
            <path d="M8.5 11V8.2a3.5 3.5 0 0 1 7 0V11"/>
          </svg>
        </label>

        <div class="row">
          <label class="remember">
            <input id="remember" type="checkbox">
            Remember me
          </label>
          <a href="#forgot" id="forgot">Forgot password?</a>
        </div>

        <button type="submit">Login</button>
        <p class="signup">Don't have an account? <a href="#register" id="show-register">Register</a></p>
      </form>
    </section>
  </div>

  <script>
    const stars = document.getElementById("stars");
    const ns = "http://www.w3.org/2000/svg";
    let seed = 11;
    const rand = () => {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    };
    for (let i = 0; i < 110; i++) {
      const star = document.createElementNS(ns, "circle");
      star.setAttribute("cx", (rand() * 160).toFixed(2));
      star.setAttribute("cy", (rand() * 72).toFixed(2));
      star.setAttribute("r", rand() > 0.92 ? "0.55" : "0.28");
      star.setAttribute("fill", "white");
      star.setAttribute("opacity", (0.35 + rand() * 0.65).toFixed(2));
      stars.appendChild(star);
    }

    const loginView = document.getElementById("login-view");
    const loginMessage = document.getElementById("login-message");
    const username = document.getElementById("username");
    const password = document.getElementById("password");

    const showMessage = (text) => {
      loginMessage.textContent = text;
      loginMessage.hidden = false;
    };

    document.getElementById("show-register").addEventListener("click", (event) => {
      event.preventDefault();
      showMessage("Registration isn't set up on this page.");
    });

    document.getElementById("forgot").addEventListener("click", (event) => {
      event.preventDefault();
      showMessage("Password reset isn't set up on this page.");
    });

    loginView.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = username.value.trim();
      if (!name || !password.value) {
        showMessage("Enter both a username and a password.");
        return;
      }
      showMessage("Signed in as " + name + ".");
    });
  </script>
</body>
</html>
